[package]
name = "hk-craft"
version = "0.4.0"
description = "HK-Craft — A Trinity Desktop Workbench for CLI AI Agents by Hongshan Tech"
authors = ["Hongshan Tech"]
license = "MIT"
edition = "2021"

[lib]
name = "hk_craft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
dirs = "6"
dunce = "1"
portable-pty = "0.8"
sysinfo = "0.36"
arboard = { version = "3", default-features = false }
encoding_rs = "0.8"
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
open = "5"
ureq = { version = "2", features = ["json"] }
